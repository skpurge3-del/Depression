<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dev Cifer • Anxiety</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.page {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
    transition: 1s ease;
}

.page::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            rgba(0,0,0,.55),
            rgba(0,0,0,.90)
        ),
        url("lonely.jpg") center/cover no-repeat;

    z-index: -2;
}

.page::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle,
            transparent 15%,
            rgba(0,0,0,.75) 100%
        );

    z-index: -1;
}

/* PAGE 1 */

#page1 {
    opacity: 1;
}

.content {
    max-width: 750px;
    padding: 25px;
}

.quote {
    font-size: clamp(24px, 5vw, 45px);
    line-height: 1.4;

    text-shadow: 0 0 25px #000;

    animation: apparition 2s ease;
}

button {
    margin-top: 40px;

    padding: 15px 48px;

    background: rgba(0,0,0,.5);
    color: white;

    border: 1px solid rgba(255,255,255,.7);

    font-size: 15px;
    font-weight: bold;
    letter-spacing: 5px;

    cursor: pointer;
    transition: .4s;
}

button:hover {
    background: white;
    color: black;

    transform: scale(1.07);

    box-shadow:
        0 0 20px rgba(255,255,255,.5);
}

/* PAGE 2 */

#page2 {
    display: none;
    opacity: 0;
    flex-direction: column;
}

.title {
    font-size: clamp(40px, 9vw, 75px);
    letter-spacing: 12px;

    text-shadow:
        0 0 15px #000,
        0 0 35px #000;
}

.subtitle {
    margin-top: 12px;

    color: #aaa;
    letter-spacing: 4px;
    font-size: 13px;
}

.musicButton {
    margin-top: 45px;
}

.musicButton.playing {
    border-color: white;
    background: white;
    color: black;
}

/* DEV CIFER — PAGE 1 + PAGE 2 */

.creator {
    position: absolute;
    bottom: 22px;
    left: 50%;

    transform: translateX(-50%);

    color: rgba(255,255,255,.75);

    font-size: 14px;
    letter-spacing: 5px;

    white-space: nowrap;

    z-index: 10;

    text-shadow: 0 0 12px #000;
}

.creator span {
    color: white;
    font-weight: bold;

    text-shadow:
        0 0 10px rgba(255,255,255,.5),
        0 0 20px rgba(255,255,255,.25);
}

/* ANIMATION */

@keyframes apparition {
    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.fadeOut {
    opacity: 0 !important;
}

/* MOBILE */

@media (max-width: 600px) {

    .quote {
        font-size: 25px;
    }

    .title {
        letter-spacing: 7px;
    }

    button {
        padding: 14px 35px;
    }

    .creator {
        bottom: 18px;
        font-size: 12px;
        letter-spacing: 4px;
    }
}
</style>
</head>

<body>

<!-- ==================== PAGE 1 ==================== -->

<section id="page1" class="page">

    <div class="content">

        <div class="quote">
            « Pourquoi je me sens seul alors que je suis entouré de personnes ? » 🖤
        </div>

        <button onclick="entrer()">
            ENTRER
        </button>

    </div>

    <!-- DEV CIFER PAGE 1 -->
    <div class="creator">
        𝑫𝒆𝒗 <span>𝑪𝒊𝒇𝒆𝒓</span>
    </div>

</section>


<!-- ==================== PAGE 2 ==================== -->

<section id="page2" class="page">

    <div>

        <div class="title">
            ANXIETY
        </div>

        <div class="subtitle">
            DOECHII • 🖤
        </div>

        <button
            id="musicButton"
            class="musicButton"
            onclick="jouer()">

            ▶ JOUER

        </button>

    </div>

    <!-- DEV CIFER PAGE 2 -->
    <div class="creator">
        𝑫𝒆𝒗 <span>𝑪𝒊𝒇𝒆𝒓</span>
    </div>

</section>


<!-- ==================== MUSIQUE ==================== -->

<audio id="audio" loop preload="auto">
    <source src="anxiety.mp4" type="audio/mp4">
</audio>


<script>

function entrer() {

    const page1 = document.getElementById("page1");
    const page2 = document.getElementById("page2");

    page1.classList.add("fadeOut");

    setTimeout(() => {

        page1.style.display = "none";

        page2.style.display = "flex";

        setTimeout(() => {
            page2.style.opacity = "1";
        }, 50);

    }, 800);
}


function jouer() {

    const audio = document.getElementById("audio");
    const button = document.getElementById("musicButton");

    if (audio.paused) {

        audio.play()
        .then(() => {

            button.innerHTML = "⏸ PAUSE";
            button.classList.add("playing");

        })
        .catch((error) => {

            console.log("Erreur audio :", error);

            alert(
                "Impossible de lire anxiety.mp4.\n\n" +
                "Vérifie que anxiety.mp4 est dans le même dossier que index.html."
            );

        });

    } else {

        audio.pause();

        button.innerHTML = "▶ JOUER";
        button.classList.remove("playing");

    }
}

</script>

</body>
</html>
